visible_hostname collection-egress
acl tunnel method CONNECT
acl publisher dstdomain -n data.austintexas.gov data.seattle.gov www2.census.gov
acl tls_port port 443
http_access allow tunnel publisher tls_port
http_access deny all

cache deny all
cache_mem 0 MB
access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0
pid_filename none
coredump_dir /tmp
shutdown_lifetime 1 seconds
connect_timeout 4 seconds
forward_timeout 8 seconds
