services:
  collector:
    build:
      context: .
      dockerfile: apps/collection-service/Dockerfile
    depends_on:
      - collection-egress
    networks: [collection_private]
    dns: [127.0.0.1]
    dns_search: ["."]
    environment:
      NO_PROXY: ""
      no_proxy: ""
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    secrets:
      - collection_service_token
    volumes:
      - collector_socket:/run/collection
      - collector_artifacts:/var/staging/collection

secrets:
  collection_service_token:
    file: ${COLLECTION_SERVICE_TOKEN_FILE:?Set the path to the private collector token file}

volumes:
  collector_socket:
  collector_artifacts:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=128m,uid=10001,gid=10001,mode=0750
